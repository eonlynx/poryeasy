[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "poryeasy"
version = "0.1.0"
description = "Map-layer editor for Pokémon GBA decomp projects, powered by Porytiles"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "eonlynx" }]
dependencies = ["pillow>=10.0"]
license = { text = "MIT" }

[project.scripts]
poryeasy = "porytiles_map:main"

[tool.setuptools]
py-modules = ["porytiles_map"]
packages = ["ptmap"]
